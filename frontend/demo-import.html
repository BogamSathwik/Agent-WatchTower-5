<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9-Rule QA Widget — Portable Import Demo</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            margin: 0;
            padding: 2rem 1.5rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 1200px;
        }
        .demo-top-bar {
            background: #111827;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .code-pill {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #06b6d4;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Host App Header -->
        <div class="demo-top-bar">
            <div>
                <h1 style="font-size: 1.3rem; margin: 0; color: #f8fafc;">External Application Integration Demo</h1>
                <p style="margin: 4px 0 0; font-size: 0.82rem; color: #94a3b8;">
                    This external page imports <span class="code-pill">nine-rule-qa-widget.js</span> with zero configuration.
                </p>
            </div>
            <div>
                <span style="font-size: 0.75rem; color: #10b981; font-weight: 700; border: 1px solid #10b981; padding: 4px 10px; border-radius: 9999px;">
                    PORTABLE COMPONENT ACTIVE
                </span>
            </div>
        </div>

        <!-- Single Drop-in Web Component Tag -->
        <nine-rules-qa api-endpoint="/api/v1" storage-key="external_app_9rules_history"></nine-rules-qa>
    </div>

    <!-- The Single Portable Importable File -->
    <script src="./nine-rule-qa-widget.js"></script>
</body>
</html>
